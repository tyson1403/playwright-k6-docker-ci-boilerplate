name: Performance

on:
  schedule:
    - cron: "0 1 * * 1-5" # weeknights, 05:00 Dubai time
  workflow_dispatch:
    inputs:
      scenario:
        description: k6 scenario to run
        type: choice
        options: [load, stress, spike, oversell, smoke]
        default: load
      scale:
        description: Multiplier for virtual users (load scenario only)
        default: "1"

jobs:
  k6:
    name: k6 ${{ inputs.scenario || 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start app container
        run: docker compose up -d --build --wait app
      - name: Run k6
        run: >
          docker compose --profile perf run --rm
          -e SCALE=${{ inputs.scale || '1' }}
          k6 run --summary-export /results/summary.json
          /scripts/scenarios/${{ inputs.scenario || 'load' }}.js
      - name: App logs
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-${{ inputs.scenario || 'load' }}-results
          path: k6-results/
      - run: docker compose down
        if: always()
