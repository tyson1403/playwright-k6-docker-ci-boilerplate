name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback first: business rules in isolation.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  # API + UI tests. Playwright starts the app itself via webServer.
  playwright:
    name: Playwright (API + UI)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm ci --prefix app
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Builds the real container image, then runs k6 against it: the smoke journey
  # plus the oversell (concurrency) check. Full load tests run in perf.yml.
  performance-smoke:
    name: Docker build + k6 smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start app container
        run: docker compose up -d --build --wait app
      - name: k6 smoke
        run: docker compose --profile perf run --rm k6 run --summary-export /results/smoke-summary.json /scripts/scenarios/smoke.js
      - name: k6 oversell (concurrency)
        run: docker compose --profile perf run --rm -e K6_WEB_DASHBOARD_EXPORT=/results/oversell-report.html k6 run /scripts/scenarios/oversell.js
      - name: App logs
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-smoke-results
          path: k6-results/
      - run: docker compose down
        if: always()
