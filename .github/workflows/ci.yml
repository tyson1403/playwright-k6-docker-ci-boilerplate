name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback first: business rules in isolation.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  # API + UI tests. Playwright starts the app itself via webServer.
  playwright:
    name: Playwright (API + UI)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci && npm ci --prefix app
      - run: npm run typecheck
      - name: Playwright Docker image matches the platform's pinned version
        run: |
          PINNED=$(node -p "require('@playwright/test/package.json').version")
          grep -q "playwright:v${PINNED}-" Dockerfile.playwright \
            || { echo "::error file=Dockerfile.playwright::Use the v${PINNED} image to match playwright-automation-platform"; exit 1; }
          echo "Platform pins Playwright ${PINNED}; Dockerfile.playwright matches"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Builds the real container image, then runs k6 against it (the smoke journey
  # plus the oversell concurrency check) and checks the database survives a restart.
  # Full load tests run in perf.yml.
  performance-smoke:
    name: Docker build + k6 smoke
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start app container
        run: docker compose up -d --build --wait app
      - name: k6 smoke
        run: docker compose --profile perf run --rm k6 run --summary-export /results/smoke-summary.json /scripts/scenarios/smoke.js
      - name: k6 oversell (concurrency)
        run: docker compose --profile perf run --rm -e K6_WEB_DASHBOARD_EXPORT=/results/oversell-report.html k6 run /scripts/scenarios/oversell.js
      - name: Accounts persist across an app restart (SQLite volume)
        run: |
          EMAIL="persist.$(date +%s)@example.com"
          BODY="{\"email\":\"$EMAIL\",\"password\":\"Secur3Pass\",\"firstName\":\"Persist\",\"lastName\":\"Check\"}"
          curl -sf -X POST localhost:3000/api/auth/register -H 'Content-Type: application/json' -d "$BODY" > /dev/null
          docker compose restart app
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health > /dev/null && break; sleep 1; done
          curl -sf -X POST localhost:3000/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"Secur3Pass\"}" > /dev/null
          echo "Registered user can still log in after the container restarted"
      - name: App logs
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-smoke-results
          path: k6-results/
      - run: docker compose down
        if: always()
